<script>
(function () {
  var D = JSON.parse(document.getElementById("data").textContent);
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function prompt(label, text) {
    var f = el("figure", "prompt"), h = el("header"), b = el("button", "copy", "Copier"), pre = el("pre", null, text);
    b.type = "button";
    b.setAttribute("aria-label", "Copier : " + label);
    b.addEventListener("click", function () {
      function ok() { b.textContent = "Copié"; b.classList.add("done"); setTimeout(function () { b.textContent = "Copier"; b.classList.remove("done"); }, 1600); }
      function fallback() { var r = document.createRange(); r.selectNodeContents(pre); var s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Sélectionné"; }
      try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
    });
    h.appendChild(el("span", "lab", label)); h.appendChild(b); f.appendChild(h); f.appendChild(pre);
    return f;
  }
  function fact(dl, k, v, cls) { var d = el("div"); d.appendChild(el("dt", null, k)); d.appendChild(el("dd", cls || null, v)); dl.appendChild(d); }

  document.getElementById("intro").textContent = D.intro;
  var picker = document.getElementById("picker");
  D.variantes.forEach(function (v) {

  var rules = document.getElementById("rules");
  D.regles.forEach(function (r) { rules.appendChild(el("li", null, r)); });

  document.getElementById("muse-desc").textContent = D.muse.description;
  var mp = document.getElementById("muse-prompts");
  mp.appendChild(prompt("Prompt muse", D.muse.prompt));
  mp.appendChild(prompt("Prompt négatif (tous les plans)", D.muse.negatif));

  var st = document.getElementById("style");
  D.style.forEach(function (s) { var d = el("div"); d.appendChild(el("b", null, s[0])); d.appendChild(el("span", null, s[1])); st.appendChild(d); });
  document.getElementById("keywords").appendChild(prompt("Mots-clés de rendu à ajouter", D.mots_cles));

  var host = document.getElementById("variants");
  D.variantes.forEach(function (v) {

    var hook = el("p", "vhook"); hook.appendChild(el("small", null, "Hook, 0–1 s")); hook.appendChild(document.createTextNode("« " + v.hook + " »")); s.appendChild(hook);
    s.appendChild(el("p", "vconcept", v.concept));
    s.appendChild(el("p", "vpieces", v.pieces));
    s.appendChild(el("h3", null, "Plan visuel"));
    var vis = el("div", "vis");
    v.visuel.forEach(function (x) { var d = el("div"); d.appendChild(el("b", null, x[0])); d.appendChild(el("span", null, x[1])); vis.appendChild(d); });
    s.appendChild(vis);
    s.appendChild(el("h3", null, "Script et prompts"));
    var ol = el("ol", "shots");
    v.plans.forEach(function (p, i) {
      var li = el("li", "shot"), side = el("div"), body = el("div");
      side.appendChild(el("div", "time", p.t)); side.appendChild(el("div", "num", "Plan " + (i + 1)));
      body.appendChild(el("h4", null, p.nom)); body.appendChild(el("span", "chip", p.source));

      fact(dl, "À l'écran", p.texte, "screen"); fact(dl, "Transition", p.transition); fact(dl, "Références", p.refs, "refs");
      body.appendChild(dl);

      stack.appendChild(prompt("Prompt vidéo", p.video));
      body.appendChild(stack);
